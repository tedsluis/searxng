#     disabled: false
#
#   - name: apk mirror
#     disabled: false
#
#   - name: mediathekviewweb
#     categories: TV
#     disabled: false

  # Disable engines explicitly to avoid warnings 
  - name: ahmia
    disabled: true
  - name: "yacy images"
    disabled: true
    # Requires base_url to personal YaCy; without that: disable engine
    # base_url: "http://yacy:8090"
